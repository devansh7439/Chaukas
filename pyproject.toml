[project]
name = "chaukas"
version = "0.1.0"
description = "On-device AI guardian against social engineering on Windows PCs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"  # onnxruntime-qnn on Windows ARM64 targets 3.11/3.12
authors = [{ name = "Devansh" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
asr = ["numpy>=1.26", "onnxruntime>=1.18"]
audio = [
    "numpy>=1.26",
    "soxr>=0.3",
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
]
context = [
    "psutil>=5.9",
    "watchdog>=4.0",
    "mss>=9.0",
]
ui = ["PySide6>=6.7"]

[project.scripts]
chaukas = "chaukas.app:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "types-psutil>=7.2.2.20260906",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaukas"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # docs keep hand-aligned code snippets

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "C4", "PT", "RUF"]
# En dash (Aho–Corasick) and the apostrophe variants the normaliser exists to unify.
allowed-confusables = ["–", "’", "‘", "ʼ"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["chaukas"]
branch = true
