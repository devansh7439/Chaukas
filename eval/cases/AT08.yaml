  - {after: 1.0, caller: "Hello sir, I am your KYC officer. To reactivate the account I need to verify you."}
  - {after: 1.0, caller: "Please read out the OTP that we have just sent to your registered mobile."}
  - {after: 0.5, mark: expected_warning}
  - {after: 2.0, user: "It says five one nine four two eight."}
  - {after: 0.5, mark: harm}
