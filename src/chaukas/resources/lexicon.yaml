# Chaukas lexicon (blueprint 6.3).
#
# Every entry passes through the same normaliser as the transcript, so write terms
# naturally: case, apostrophes ("don't" = "do not") and Devanagari digits don't matter.
# English entries also match -s/-es/-ed/-ing forms of their last word ("arrest" matches
# "arrested").
#
#   tactics.<kind>.terms     one word → strong tier (0.5); several words → phrase tier (0.6)
#   tactics.<kind>.weak      weak tier (0.3): never triggers the LLM or counts as a chain step
#   requests.<kind>          fast path (0.75): a verb and an object close together
#   negation                 a negator next to a request verb turns it into advice, not a request
#   suppress                 keyword hits inside these phrases count for nothing; every
#                            sentence of Chaukas's own alerts (ui/strings.py) is added too
#
# Expand with the spellings Whisper actually produces; keep ambiguous everyday words weak.

version: 1

