            ट्रांसफर करो, भेजो, भेज दो, जमा करो, डालो]
    stems: {give: [bhej, daal], do: [transfer, jama, deposit, pay, send]}
    objects: [money, amount, funds, payment, paise, paisa, rupees, rupaye, rs, ₹,
              hazaar, hazar, lakh, deposit, duty, fee,
              पैसे, रकम, रुपये]

negation:
  gap: 1                                   # filler words allowed between a negator and its verb
  # Only these may sit in that gap: in "don't worry send the OTP" the negator belongs to
  # "worry", so the request stays a request (the caller must not be able to forge advice).
  fillers: [ever, even, please, kabhi, bhi, कभी, भी]
  before: [not, never, "no", mat, nahi, nahin, na, मत, नहीं, न]   # quoted: bare no is a YAML boolean
  after: [nahi, nahin, mat, नहीं, मत]      # "batana nahi", "share mat karna"
  # ...only when one of these, or the end of the clause, follows the negator: in "OTP batao
  # nahi toh account band" the "nahi toh" means "otherwise", so it stays a request
  helpers: [karna, karo, kariye, kijiye, karein, karen, kare, kar, dena, do, dijiye, dijie,
            dein, de, lena, lijiye, hai, hain, chahiye,
            करना, करो, करें, कर, देना, दें, है, चाहिए]
  # "OTP ya PIN ... mat bataiye": advice covers every object in a list joined by these
  connectors: [or, and, ya, aur, या, और]
  # "kisi ko mat batana, sirf mujhe batao": a request aimed at the speaker is a request even
  # beside "don't tell anyone" (singular only: a real bank says "tell us if anyone asks")
  redirect: [me, mujhe, mujhko, मुझे, मुझको]

# Hindi compound verbs: a request stem plus a helper is the request itself ("OTP bata
# dijiye", "code confirm kariye", "paise jama kar dijiye"). Stems are listed per request.
compounds:
  give: [do, de do, dijiye, dijie, dijiyega, dein, dena, de dijiye]
  do: [karo, kariye, kijiye, karein, karen, karna, kar do, kar dijiye, kar dein, kar dena,
       kar lijiye, kar lo, kar dijiyega]

suppress: [pin code, pincode, postal code, पिन कोड]
